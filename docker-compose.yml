services:
  # ─── PostgreSQL ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: financas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-financas_user}
      # Sem default: o compose falha em vez de subir com senha conhecida
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env/Portainer}
      POSTGRES_DB: ${DB_NAME:-financas_db}
    ports:
      # Só no loopback do host — para acessar de fora, use túnel SSH
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - internal

  # ─── Backend (Node.js / Express) ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financas-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-financas_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-financas_db}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://localhost:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    mem_limit: 768m
    networks:
      - internal

  # ─── Frontend (React / Vite) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financas-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      - backend
    volumes:
      - ./backend/uploads:/usr/share/nginx/html/uploads:ro
    mem_limit: 128m
    networks:
      - internal
      - proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.fincas.rule=Host(`${APP_HOST:-fincas.local}`)'
      - 'traefik.http.routers.fincas.entrypoints=websecure'
      - 'traefik.http.routers.fincas.tls.certresolver=le'
      - 'traefik.http.services.fincas.loadbalancer.server.port=80'

  # ─── Console de Logs (Dozzle) ──────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: financas-logs
    restart: unless-stopped
    volumes:
      # Somente leitura: com acesso de escrita ao socket, um comprometimento
      # do Dozzle vira controle total do host
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Só no loopback: o Dozzle não tem autenticação e mostra os logs de TODOS
      # os containers — inclusive linhas com dados sensíveis. Acesse por túnel SSH.
      - '127.0.0.1:8888:8080'
    environment:
      - DOZZLE_LEVEL=info
    mem_limit: 128m
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
  proxy:
    external: true
